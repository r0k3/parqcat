name: Publish to crates.io

# Called by release.yml (cargo-dist) when a version tag is pushed.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: exchange a GitHub OIDC token for a short-lived
      # crates.io token. crates.io must list release.yml as a trusted publisher.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
