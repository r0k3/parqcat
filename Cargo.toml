[package]
name = "parqcat"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
authors = ["Robert Kende"]
license = "Apache-2.0"
description = "A lightweight Unix-style CLI for inspecting Parquet files."
readme = "README.md"
repository = "https://github.com/r0k3/parqcat"
documentation = "https://docs.rs/parqcat"
keywords = ["parquet", "cli", "jsonl", "arrow"]
categories = ["command-line-utilities"]
exclude = [".github/", ".gitignore"]

[dependencies]
arrow-array = "58.3.0"
arrow-schema = "58.3.0"
base64 = "0.22.1"
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
parquet = { version = "58.3.0", default-features = false, features = [
    "arrow",
    "base64",
    "brotli",
    "flate2-zlib-rs",
    "lz4",
    "simdutf8",
    "snap",
    "zstd",
] }
serde_json = "1.0.147"
tempfile = "3.27.0"
zstd = { version = "0.13.3", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
